spring:
  application:
    name: quickbite-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quickbite}
    username: ${DB_USERNAME:quickbite}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

quickbite:
  order:
    delivery-fee: ${DELIVERY_FEE:2.50}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl-ms: ${JWT_ACCESS_TOKEN_TTL_MS:900000}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
