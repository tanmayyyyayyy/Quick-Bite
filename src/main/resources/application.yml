spring:
  application:
    name: quickbite-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quickbite}
    username: ${DB_USERNAME:quickbite}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
